[package]
name = "bench-app"
version = "1.1.0"
edition = "2021"

[dependencies]
bench-core = { path = "../bench-core" }
dioxus = { version = "0.6", features = ["desktop"] }
regex = "1.13.1"
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "tokio"] }
serialport = { version = "4.10", default-features = false }
tokio = { version = "1", features = ["sync"] }

# SCPreferences helpers are Apple-only; Windows/Linux keep the default netdev surface.
[target.'cfg(target_os = "macos")'.dependencies]
netdev = { version = "0.47", default-features = false, features = ["apple-system-configuration-extra"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
netdev = { version = "0.47", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
